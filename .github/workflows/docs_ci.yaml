name: Docs CI

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "*.md"
      - "devtools/conda-envs/docs_env.yaml"
      - "devtools/check_distribution_inputs.py"
      - "devtools/dependency_routes.toml"
      - ".github/workflows/docs_ci.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "*.md"
      - "devtools/conda-envs/docs_env.yaml"
      - "devtools/check_distribution_inputs.py"
      - "devtools/dependency_routes.toml"
      - ".github/workflows/docs_ci.yaml"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out reviewed distribution tools
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsyssuite
          ref: 6d6172d6cd00c5ac2d4ebadb71df554ec5b7fa26
          path: .governance-tools
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.14
          cache-downloads: true

      - name: Info conda
        shell: bash -l {0}
        run: |
          micromamba activate docs
          micromamba info
          micromamba list

      - name: Check distribution inputs
        shell: bash -l {0}
        run: python devtools/check_distribution_inputs.py --suite-root .governance-tools

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      - name: Build docs
        shell: bash -l {0}
        run: |
          make -C docs html
