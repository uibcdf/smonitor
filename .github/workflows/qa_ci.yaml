name: QA CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/qa_env.yaml
          environment-name: qa
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.13
          cache-downloads: true

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      - name: Run lint
        shell: bash -l {0}
        run: |
          ruff check .

      - name: Run tests (default profile)
        shell: bash -l {0}
        run: |
          pytest -v

      - name: Run strict schema smoke (qa profile)
        shell: bash -l {0}
        run: |
          export SMONITOR_PROFILE=qa
          export SMONITOR_STRICT_SCHEMA=1
          pytest -v tests/test_schema_strict.py tests/test_validation.py

      - name: Build package artifacts (sdist/wheel)
        shell: bash -l {0}
        run: |
          python -m pip install build
          python -m build

      - name: Smoke install from wheel + CLI
        shell: bash -l {0}
        run: |
          python -m pip install --force-reinstall dist/*.whl --no-deps
          cd /tmp
          python -c "import smonitor; print(smonitor.__version__)"
          python -m smonitor.cli --check --check-event '{"level":"WARNING","message":"ok"}'

  # The cross-library end-to-end check the 1.0.0 exit criteria ask for. It lived
  # only in `tests/e2e/`, where it skips itself unless the sibling repositories sit
  # next to this one — which is true on a maintainer's machine and was never true
  # here, so the criterion was being read as satisfied by a test CI never ran.
  #
  # The siblings are imported from source through `sys.path`, so they are cloned
  # rather than installed; only their third-party dependencies are needed.
  collective-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check out the sibling libraries beside this one
        run: |
          cd "${{ github.workspace }}/.."
          for repo in argdigest depdigest pyunitwizard; do
            git clone --depth 1 "https://github.com/uibcdf/${repo}.git" "${repo}"
          done
          ls -1

      - name: Install what the siblings need
        run: python -m pip install --upgrade pip numpy pint pytest

      - name: Run the collective error path
        env:
          # Turns "sibling missing" from a silent skip into a failure, so this job
          # cannot report success by not running the thing it exists to run.
          SMONITOR_REQUIRE_COLLECTIVE_E2E: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v -rs tests/e2e/
