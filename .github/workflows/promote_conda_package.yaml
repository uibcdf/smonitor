name: Promote an exact conda package

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the published release
        required: true
        type: string
      version:
        description: Three-part published release version
        required: true
        type: string
      build_number:
        description: Exact verified staging build number
        required: true
        type: number
      sha256:
        description: SHA-256 of the independently verified staging package
        required: true
        type: string
      installed_run_id:
        description: Successful twelve-cell installed-artifact qualification run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: smonitor-conda-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote the digest-verified noarch package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Validate immutable published release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq .draft)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" --jq .prerelease)" = false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify the staged release decision and exact CI gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python devtools/conda-build/release_route.py check \
            --version "$RELEASE_VERSION" --route staged \
            --sha "$CANDIDATE_SHA" --repository "$GITHUB_REPOSITORY" \
            --receipt "$RUNNER_TEMP/smonitor-conda-route.json"

      - uses: actions/checkout@v4
        with:
          repository: uibcdf/molsyssuite
          ref: 25363f2a2c902c04b2cdc8b301a3e1c1ff0c0918
          path: .molsyssuite
          persist-credentials: false

      - name: Bind the committed installed matrix to the exact archive
        id: installed_descriptor
        env:
          SHA256: ${{ inputs.sha256 }}
        run: |
          python -m pip install 'PyYAML>=6,<7' 'Jinja2>=3,<4' 'packaging>=24'
          python .molsyssuite/devtools/scripts/noarch_conda.py --root . \
            --promotion-sha256 "$SHA256" --github-output "$GITHUB_OUTPUT"

      - name: Verify every installed cell and executed test step
        id: installed_matrix
        uses: uibcdf/molsyssuite/.github/actions/verify-installed-matrix@25363f2a2c902c04b2cdc8b301a3e1c1ff0c0918
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.installed_run_id }}
          candidate-sha: ${{ inputs.candidate_sha }}
          workflow: ${{ steps.installed_descriptor.outputs.workflow }}
          title: ${{ steps.installed_descriptor.outputs.title }}
          profile: ${{ steps.installed_descriptor.outputs.profile }}

      - name: Set up the authenticated Anaconda client
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: promote
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.14

      - name: Derive the exact package identity
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          spec="uibcdf/smonitor/$RELEASE_VERSION/noarch/smonitor-$RELEASE_VERSION-py_$BUILD_NUMBER.tar.bz2"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Promote the verified staged artifact
        id: promotion
        uses: uibcdf/action-build-and-upload-conda-packages/promote@v2.2.2
        with:
          package-spec: ${{ steps.identity.outputs.spec }}
          expected-sha256: ${{ inputs.sha256 }}
          from-label: staging
          to-label: main
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}

      - name: Retain the promotion receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: smonitor-conda-promotion-${{ inputs.version }}-py_${{ inputs.build_number }}
          path: |
            ${{ steps.promotion.outputs.receipt }}
            ${{ runner.temp }}/smonitor-conda-route.json
            ${{ steps.installed_matrix.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Independently verify the public channel
        shell: bash -l {0}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          output="$RUNNER_TEMP/smonitor-conda-main.json"
          conda search --json --override-channels -c uibcdf \
            "smonitor=$RELEASE_VERSION=py_$BUILD_NUMBER" > "$output"
          python - "$output" <<'PY'
          import json
          import os
          import pathlib
          import sys

          records = json.loads(pathlib.Path(sys.argv[1]).read_text())["smonitor"]
          expected = os.environ["EXPECTED_SHA256"]
          matches = [record for record in records if record.get("sha256") == expected]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected one public artifact with SHA-256 {expected}, got {len(matches)}"
              )
          record = matches[0]
          if record["channel"] != "https://conda.anaconda.org/uibcdf/noarch":
              raise SystemExit(f"unexpected public channel: {record['channel']}")
          print(record["url"])
          PY

      - name: Independently verify registry label and solver digest
        id: public_verification
        uses: uibcdf/molsyssuite/.github/actions/verify-public-conda@25363f2a2c902c04b2cdc8b301a3e1c1ff0c0918
        with:
          package: smonitor
          version: ${{ inputs.version }}
          subdir: noarch
          filename: smonitor-${{ inputs.version }}-py_${{ inputs.build_number }}.tar.bz2
          sha256: ${{ inputs.sha256 }}

      - name: Retain independent public verification
        if: ${{ always() && steps.public_verification.outputs.evidence-path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: smonitor-public-conda-${{ inputs.version }}-py_${{ inputs.build_number }}
          path: ${{ steps.public_verification.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
