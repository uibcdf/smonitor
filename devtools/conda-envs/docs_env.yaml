channels:
  - uibcdf
  - conda-forge

dependencies:
  - python=3.14
  - pip
  - sphinx
  - sphinx-copybutton
  - sphinx-remove-toctrees
  - sphinx-design
  - sphinx-favicon
  - myst-nb
  - pydata-sphinx-theme
  - nbsphinx
  - ipykernel
  - pandoc
  - versioningit

  # Shared distribution-input parser tooling; not public runtime dependencies.
  - pyyaml >=6,<7
  - jinja2 >=3,<4
  - packaging >=24
