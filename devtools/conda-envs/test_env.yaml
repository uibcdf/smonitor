channels:
  - uibcdf
  - conda-forge

dependencies:
  - python >=3.11,<3.15
  - pip
  - pytest
  - pytest-cov
  - pytest-xdist
  - pytest-receptor=1.2.0
  - ruff=0.16.5
  - versioningit

  # Shared distribution-input parser tooling; not public runtime dependencies.
  - pyyaml >=6,<7
  - jinja2 >=3,<4
  - packaging >=24
