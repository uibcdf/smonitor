channels:
  - uibcdf
  - conda-forge

dependencies:
  # --- Python base ---
  - python=3.14
  - pip

  # --- Dev tools: formatting, linting, testing ---
  - ruff=0.16.5
  - pytest
  - pytest-cov
  - pytest-receptor=1.2.0
  - versioningit

  # --- Documentation with Sphinx and MyST ---
  - sphinx
  - myst-nb
  - pydata-sphinx-theme

  # Shared distribution-input parser tooling; not public runtime dependencies.
  - pyyaml >=6,<7
  - jinja2 >=3,<4
  - packaging >=24
