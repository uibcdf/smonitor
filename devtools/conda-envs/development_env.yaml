channels:
  - uibcdf
  - conda-forge

dependencies:
  # --- Python base ---
  - python=3.13
  - pip

  # --- Dev tools: formatting, linting, testing ---
  - ruff=0.16.5
  - pytest
  - pytest-cov
  - pytest-receptor=1.1.0
  - versioningit

  # --- Documentation with Sphinx and MyST ---
  - sphinx
  - myst-nb
  - pydata-sphinx-theme
