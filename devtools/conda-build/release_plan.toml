# Reviewed for the 0.22.0 candidate before creating its immutable tag.
schema = "molsyssuite.conda-plan@1"
version = "0.22.0"
package = "smonitor"
build_number = 0
route = "staged"
profile = "noarch-python"
reason = "SMonitor adds an opt-in pytest QA policy and versioned diagnostic-identity baseline over Pytest Receptor's canonical artifact (#32). The public CLI and policy reader are a new compatibility surface. Qualify the exact installed noarch candidate on all twelve supported OS/Python cells before public visibility; keep pytest outcomes and rich support bundles under their existing owners."
decision_by = "Repository maintainer via Codex on 2026-10-22"
artifact_subdirs = ["noarch"]
test_platforms = ["linux-64", "osx-arm64", "win-64"]
python_versions = ["3.11", "3.12", "3.13", "3.14"]
required_workflows = [".github/workflows/CI_full_matrix.yaml", ".github/workflows/molsyssuite-policy.yml"]
requires_installed_gate = true
new_compatibility_surface = true
coupled_release = false
dependencies_public = true

[gate_jobs.".github/workflows/CI_full_matrix.yaml"]
"Full test on ubuntu-latest, Python 3.11" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on ubuntu-latest, Python 3.12" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on ubuntu-latest, Python 3.13" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on ubuntu-latest, Python 3.14" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on macos-latest, Python 3.11" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on macos-latest, Python 3.12" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on macos-latest, Python 3.13" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on macos-latest, Python 3.14" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on windows-latest, Python 3.11" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on windows-latest, Python 3.12" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on windows-latest, Python 3.13" = ["Check distribution inputs", "Test import module", "Run tests"]
"Full test on windows-latest, Python 3.14" = ["Check distribution inputs", "Test import module", "Run tests"]

[gate_jobs.".github/workflows/molsyssuite-policy.yml"]
"policy / conformance" = ["Check repository conformance", "Check Python lint and imports", "Check Python formatting"]
