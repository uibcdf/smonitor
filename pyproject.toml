[project]
name = "smonitor"
dynamic = ["version"]
description = "SMonitor — Centralized diagnostic & telemetry system for the scientific Python stack"
readme = "README.md"
authors = [
  { name = "UIBCDF Development Team" }
]
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
rich = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/uibcdf/smonitor"
Repository = "https://github.com/uibcdf/smonitor"
Documentation = "https://uibcdf.github.io/smonitor"

[build-system]
requires = ["setuptools>=68", "versioningit~=3.0" ,"wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "smonitor",
  "smonitor.core",
  "smonitor.emitters",
  "smonitor.handlers",
  "smonitor.config",
  "smonitor.policy",
  "smonitor.integrations",
  "smonitor.templates",
]

[tool.setuptools.package-data]
"smonitor.templates" = ["_smonitor.py", "README.md"]

[project.scripts]
smonitor = "smonitor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi"]
extend-exclude = [
  "GH_RUN_RECEPTOR_GUIDE.md",
  "MOLSYSSUITE_GUIDE.md",
  "PYTEST_RECEPTOR_GUIDE.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
# Preserve prose, examples, and archived evidence; Python files remain gated.
exclude = ["*.md"]

[tool.versioningit]
default-version = "0.0.0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "0.0.0"
[tool.versioningit.tag2version]
regex = '^(?P<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
require-match = true

[tool.versioningit.write]
file = "smonitor/_version.py"
